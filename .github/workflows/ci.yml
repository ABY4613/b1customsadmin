name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Verify build output
        run: |
          test -f build/web/index.html && echo "✅ index.html exists" || exit 1
          test -f build/web/main.dart.js && echo "✅ main.dart.js exists" || exit 1
          test -f build/web/flutter_bootstrap.js && echo "✅ flutter_bootstrap.js exists" || exit 1
          echo "✅ Build output verified successfully"
